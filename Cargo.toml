[package]
name = "linux-kernel-cmdline"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bootc-dev/linux-kernel-cmdline"
homepage = "https://github.com/bootc-dev/linux-kernel-cmdline"
readme = "README.md"
keywords = ["kernel", "cmdline", "boot", "linux", "parsing"]
categories = ["os::linux-apis", "parser-implementations"]

description = """
A parser for the Linux kernel command line (/proc/cmdline), supporting both
byte-level and UTF-8 parsing with proper quote handling and dash/underscore
equivalence for parameter keys.
"""

[features]
serde = ["dep:serde"]

[dependencies]
anyhow = "1.0.82"
serde = { version = "1.0.199", features = ["derive"], optional = true }

[dev-dependencies]
similar-asserts = "2.0.0"
static_assertions = "1.1.0"

[lints.rust]
unsafe_code = "deny"
unused_must_use = "forbid"
missing_docs = "allow"
missing_debug_implementations = "deny"
dead_code = "deny"

[lints.clippy]
disallowed_methods = "deny"
dbg_macro = "deny"
todo = "deny"
needless_borrow = "allow"
needless_borrows_for_generic_args = "allow"
